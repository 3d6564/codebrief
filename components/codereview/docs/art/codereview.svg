<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Codereview</title>
  <desc id="desc">Codereview examines pull-request context and repository guidance, verifies findings, and produces a report before any remote action.</desc>

  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0v32" fill="none" stroke="#26324a" stroke-width="1"/>
    </pattern>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7f4"/>
      <stop offset="1" stop-color="#eadbd7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#050912" flood-opacity=".45"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="24" fill="#0d1424"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)" opacity=".55"/>
  <path d="M0 286C172 233 304 330 469 280s294-40 402 3 214 42 329-13v90H0z" fill="#111d32"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="64" y="81" fill="#e87883" font-size="16" font-weight="700" letter-spacing="4">CONTEXT  /  VERIFY  /  REPORT</text>
    <text x="60" y="146" fill="#fff7f4" font-family="ui-sans-serif, system-ui, sans-serif" font-size="64" font-weight="800" letter-spacing="-2">Codereview</text>
    <text x="64" y="190" fill="#aebbd0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20">Find what matters before changing anything remote.</text>

    <g transform="translate(64 234)" font-size="12" font-weight="700">
      <rect width="158" height="90" rx="18" fill="#18253d" stroke="#6f82a3"/>
      <path d="M24 25h48M24 40h34" stroke="#68d5c1" stroke-width="4" stroke-linecap="round"/>
      <path d="M86 25h48M86 40h31" stroke="#e87883" stroke-width="4" stroke-linecap="round"/>
      <text x="79" y="69" text-anchor="middle" fill="#dce6f5" font-size="14">PR DIFF</text>
    </g>

    <g fill="none" stroke="#e87883" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M222 279h70"/>
      <path d="m283 271 10 8-10 8"/>
    </g>

    <g transform="translate(307 234)" font-size="12" font-weight="700">
      <rect width="158" height="90" rx="18" fill="#18253d" stroke="#6f82a3"/>
      <circle cx="58" cy="39" r="22" fill="none" stroke="#f6ae4a" stroke-width="5"/>
      <path d="m74 55 20 20" stroke="#f6ae4a" stroke-width="6" stroke-linecap="round"/>
      <text x="118" y="43" text-anchor="middle" fill="#dce6f5" font-size="11">CHECK</text>
      <text x="118" y="59" text-anchor="middle" fill="#dce6f5" font-size="11">IMPACT</text>
    </g>

    <g fill="none" stroke="#e87883" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M465 279h70"/>
      <path d="m526 271 10 8-10 8"/>
    </g>

    <g transform="translate(550 234)" font-size="12" font-weight="700">
      <rect width="158" height="90" rx="18" fill="#18253d" stroke="#6f82a3"/>
      <path d="M24 27h110M24 44h82M24 61h96" stroke="#aebbd0" stroke-width="4" stroke-linecap="round"/>
      <circle cx="128" cy="61" r="5" fill="#e87883"/>
      <text x="79" y="80" text-anchor="middle" fill="#dce6f5" font-size="10">FINDINGS FIRST</text>
    </g>

    <g transform="translate(762 43)" filter="url(#shadow)">
      <path d="M0 0h326l52 52v248H0z" fill="url(#paper)"/>
      <path d="M326 0v52h52" fill="#cfbab5"/>
      <path d="M326 0v52h52" fill="none" stroke="#9d7f79" stroke-width="2"/>
      <text x="32" y="49" fill="#a63d4a" font-size="13" font-weight="800" letter-spacing="3">REVIEW REPORT</text>
      <path d="M32 69h294" stroke="#b99e98" stroke-width="2"/>

      <g transform="translate(32 96)">
        <rect width="314" height="52" rx="12" fill="#f4d9dc"/>
        <circle cx="24" cy="26" r="10" fill="#b64c59"/>
        <text x="24" y="30" text-anchor="middle" fill="#fff7f4" font-size="11" font-weight="800">1</text>
        <text x="46" y="23" fill="#48282d" font-size="13" font-weight="800">ACTIONABLE FINDING</text>
        <text x="46" y="40" fill="#76545a" font-size="11">Evidence, impact, and location</text>
      </g>

      <g transform="translate(32 164)">
        <circle cx="10" cy="10" r="8" fill="#318979"/>
        <path d="m6 10 3 3 6-7" fill="none" stroke="#fff7f4" stroke-width="2"/>
        <text x="30" y="15" fill="#313b4d" font-size="13">Checks and review history verified</text>
      </g>
      <g transform="translate(32 201)">
        <circle cx="10" cy="10" r="8" fill="#318979"/>
        <path d="m6 10 3 3 6-7" fill="none" stroke="#fff7f4" stroke-width="2"/>
        <text x="30" y="15" fill="#313b4d" font-size="13">Repository guidance applied</text>
      </g>
      <path d="M32 240h294" stroke="#b99e98" stroke-width="2" stroke-dasharray="5 6"/>
      <rect x="32" y="255" width="245" height="28" rx="14" fill="#dbc8c4"/>
      <circle cx="48" cy="269" r="5" fill="#a63d4a"/>
      <text x="61" y="274" fill="#6f4d52" font-size="11" font-weight="700">REMOTE ACTION REQUIRES APPROVAL</text>
    </g>
  </g>
</svg>
