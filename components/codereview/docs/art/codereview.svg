<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Codereview</title>
  <desc id="desc">Pull-request changes and repository guidance pass through Codereview into a findings-first report before any remote action.</desc>

  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0v32" fill="none" stroke="#26324a" stroke-width="1"/>
    </pattern>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7f4"/>
      <stop offset="1" stop-color="#eadbd7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#050912" flood-opacity=".45"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="24" fill="#0d1424"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)" opacity=".55"/>
  <path d="M0 286C172 233 304 330 469 280s294-40 402 3 214 42 329-13v90H0z" fill="#111d32"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="64" y="81" fill="#e87883" font-size="16" font-weight="700" letter-spacing="4">CONTEXT  /  VERIFY  /  REPORT</text>
    <text x="60" y="146" fill="#fff7f4" font-family="ui-sans-serif, system-ui, sans-serif" font-size="64" font-weight="800" letter-spacing="-2">Codereview</text>
    <text x="64" y="190" fill="#aebbd0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20">Find what matters before changing anything remote.</text>

    <g font-size="14" font-weight="700">
      <rect x="64" y="238" width="151" height="38" rx="19" fill="#18253d" stroke="#52627d"/>
      <circle cx="86" cy="257" r="5" fill="#e87883"/>
      <text x="101" y="262" fill="#dce6f5">PR DIFF</text>
      <rect x="64" y="288" width="151" height="38" rx="19" fill="#18253d" stroke="#52627d"/>
      <circle cx="86" cy="307" r="5" fill="#75b8ff"/>
      <text x="101" y="312" fill="#dce6f5">GUIDANCE</text>
    </g>

    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M215 257h74c29 0 29 25 54 25h41" stroke="#e87883" stroke-width="3"/>
      <path d="M215 307h74c29 0 29-25 54-25h41" stroke="#75b8ff" stroke-width="3"/>
      <path d="M518 282h88" stroke="#e9dfc5" stroke-width="3"/>
      <path d="m597 274 10 8-10 8" stroke="#e9dfc5" stroke-width="3"/>
    </g>

    <g transform="translate(384 229)">
      <rect width="134" height="106" rx="18" fill="#18253d" stroke="#6f82a3"/>
      <circle cx="57" cy="48" r="20" fill="none" stroke="#e87883" stroke-width="4"/>
      <path d="m72 63 16 16" stroke="#e87883" stroke-width="5" stroke-linecap="round"/>
      <path d="m96 36 7 7 13-16" fill="none" stroke="#68d5c1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="67" y="94" text-anchor="middle" fill="#e87883" font-size="11" font-weight="700">CODEREVIEW</text>
    </g>

    <g transform="translate(633 45)" filter="url(#shadow)">
      <path d="M0 0h390l70 70v230H0z" fill="url(#paper)"/>
      <path d="M390 0v70h70" fill="#cfbab5"/>
      <path d="M390 0v70h70" fill="none" stroke="#9d7f79" stroke-width="2"/>
      <text x="36" y="54" fill="#a63d4a" font-size="13" font-weight="800" letter-spacing="3">REVIEW REPORT</text>
      <text x="36" y="94" fill="#48282d" font-size="23" font-weight="800">FINDINGS FIRST</text>
      <path d="M36 112h352" stroke="#b99e98" stroke-width="2"/>

      <g transform="translate(36 132)">
        <rect width="352" height="58" rx="12" fill="#f4d9dc"/>
        <circle cx="24" cy="29" r="10" fill="#b64c59"/>
        <text x="24" y="33" text-anchor="middle" fill="#fff7f4" font-size="11" font-weight="800">1</text>
        <text x="46" y="26" fill="#48282d" font-size="13" font-weight="800">ACTIONABLE FINDING</text>
        <text x="46" y="43" fill="#76545a" font-size="11">Evidence, impact, and exact location</text>
      </g>

      <circle cx="42" cy="220" r="7" fill="#318979"/>
      <path d="m38 220 3 3 6-7" fill="none" stroke="#fff7f4" stroke-width="2"/>
      <text x="60" y="225" fill="#313b4d" font-size="13">Checks and guidance verified</text>

      <path d="M36 246h352" stroke="#b99e98" stroke-width="2" stroke-dasharray="5 6"/>
      <rect x="36" y="261" width="245" height="28" rx="14" fill="#dbc8c4"/>
      <circle cx="52" cy="275" r="5" fill="#a63d4a"/>
      <text x="65" y="280" fill="#6f4d52" font-size="11" font-weight="700">REMOTE ACTION REQUIRES APPROVAL</text>
    </g>
  </g>
</svg>
